.hair{stroke:var(--line);stroke-width:1}
.dot{fill:var(--ink)}
</style><title id="sec-title">Secuencia de un cobro</title><desc id="sec-desc">Desde que el dueño pide el cobro hasta el aviso de que el pago entró: borrador, confirmación, operación escrita antes de llamar a pey, push, pago y webhook.</desc><defs>
