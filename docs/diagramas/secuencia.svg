<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-labelledby="sec-title sec-desc" width="1240" height="800"><style>:root{--paper:#fff7ec;--card:#ffffff;--ink:#1d1a16;--muted:#6b6258;--soft:#9a8f82;--line:#efe3d3;--accent:#e8457a;--accent-tint:#fde6ee;--accent-text:#b8244f;--green:#1f8a5b;--green-tint:#def2e8;--yellow:#ffcf3f;--store:rgba(29,26,22,0.05);--ext:rgba(29,26,22,0.03);--zone:rgba(29,26,22,0.025)}@media (prefers-color-scheme:dark){:root{--paper:#1a1612;--card:#25201a;--ink:#f5ebdc;--muted:#b5a898;--soft:#7d7266;--line:#3a3228;--accent:#ff6b9a;--accent-tint:#3a2230;--accent-text:#ff8fb3;--green:#3fbf8a;--green-tint:#1d3a2e;--yellow:#ffcf3f;--store:rgba(245,235,220,0.06);--ext:rgba(245,235,220,0.04);--zone:rgba(245,235,220,0.035)}}
.bg{fill:var(--paper)}
.mask{fill:var(--paper)}
.nd{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
.nd-focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.8}
