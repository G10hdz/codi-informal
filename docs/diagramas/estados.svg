<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" role="img" aria-labelledby="est-title est-desc" width="1180" height="610"><style>:root{--paper:#fff7ec;--card:#ffffff;--ink:#1d1a16;--muted:#6b6258;--soft:#9a8f82;--line:#efe3d3;--accent:#e8457a;--accent-tint:#fde6ee;--accent-text:#b8244f;--green:#1f8a5b;--green-tint:#def2e8;--yellow:#ffcf3f;--store:rgba(29,26,22,0.05);--ext:rgba(29,26,22,0.03);--zone:rgba(29,26,22,0.025)}@media (prefers-color-scheme:dark){:root{--paper:#1a1612;--card:#25201a;--ink:#f5ebdc;--muted:#b5a898;--soft:#7d7266;--line:#3a3228;--accent:#ff6b9a;--accent-tint:#3a2230;--accent-text:#ff8fb3;--green:#3fbf8a;--green-tint:#1d3a2e;--yellow:#ffcf3f;--store:rgba(245,235,220,0.06);--ext:rgba(245,235,220,0.04);--zone:rgba(245,235,220,0.035)}}
.bg{fill:var(--paper)}
.mask{fill:var(--paper)}
.nd{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
.nd-focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.8}
.nd-store{fill:var(--store);stroke:var(--muted);stroke-width:1.2}
.nd-ext{fill:var(--ext);stroke:var(--soft);stroke-width:1.2}
.nd-ok{fill:var(--green-tint);stroke:var(--green);stroke-width:1.8}
.nd-end{fill:var(--card);stroke:var(--ink);stroke-width:2.2}
.zone{fill:var(--zone);stroke:var(--soft);stroke-width:1;stroke-dasharray:5 4}
.ar{fill:none;stroke:var(--muted);stroke-width:1.5}
.ar.d{stroke-dasharray:5 4}
.ar.a{stroke:var(--accent);stroke-width:1.9}
.ar.g{stroke:var(--green);stroke-width:1.9}
.mk{fill:var(--muted)} .mk-a{fill:var(--accent)} .mk-g{fill:var(--green)}
.life{stroke:var(--soft);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.nm{font-family:'Bricolage Grotesque','Inter',system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--ink)}
.nm-f{fill:var(--accent-text)}
.nm-g{fill:var(--green)}
.sb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:var(--muted)}
.lb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:var(--muted)}
.lb-t{font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:13px;fill:var(--ink)}
.lb-a{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:13px;fill:var(--accent-text)}
.note{font-family:Inter,system-ui,sans-serif;font-style:italic;font-size:12px;fill:var(--muted)}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.14em;fill:var(--muted);text-transform:uppercase}
.chip{fill:var(--card);stroke:var(--soft);stroke-width:1}
.chip-a{fill:var(--accent-tint);stroke:var(--accent)}
.chip-g{fill:var(--green-tint);stroke:var(--green)}
.chip-t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;fill:var(--ink)}
.hair{stroke:var(--line);stroke-width:1}
.dot{fill:var(--ink)}
</style><title id="est-title">Estados de una operación</title><desc id="est-desc">Máquina de estados de una operación de cobro: creando, creada, incierto, fallida, pendiente y pagado, con lo que dispara cada transición.</desc><defs>
<marker id="est-m" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon class="mk" points="0 0, 9 3.5, 0 7"/></marker>
<marker id="est-ma" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon class="mk-a" points="0 0, 9 3.5, 0 7"/></marker>
<marker id="est-mg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon class="mk-g" points="0 0, 9 3.5, 0 7"/></marker>
