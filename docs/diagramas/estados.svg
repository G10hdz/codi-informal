sk" x="900" y="90" width="160" height="64" rx="8"/><rect class="nd-ok" x="900" y="90" width="160" height="64" rx="8"/><text class="nm nm-g" x="980.0" y="114" text-anchor="middle">pagado</text><text class="sb" x="980.0" y="133" text-anchor="middle">registro.py:259</text><rect class="mask" x="900" y="400" width="160" height="64" rx="8"/><rect class="nd-end" x="900" y="400" width="160" height="64" rx="8"/><text class="nm " x="980.0" y="424" text-anchor="middle">fallida</text><text class="sb" x="980.0" y="443" text-anchor="middle">agente.py:164</text><rect class="mask" x="217" y="101" width="126" height="16" rx="2"/><text class="lb" x="280" y="112" text-anchor="middle">pey respondió 2xx</text><rect class="mask" x="262" y="411" width="85" height="16" rx="2"/><text class="lb" x="305" y="422" text-anchor="middle">PeyIncierto</text><rect class="mask" x="500" y="509" width="201" height="16" rx="2"/><text class="lb" x="600" y="520" text-anchor="middle">PeyError (pey respondió 4xx)</text><rect class="mask" x="456" y="279" width="119" height="16" rx="2"/><text class="lb" x="460" y="290" text-anchor="start">resolver: creada</text><rect class="mask" x="652" y="411" width="126" height="16" rx="2"/><text class="lb" x="715" y="422" text-anchor="middle">resolver: fallida</text><rect class="mask" x="625" y="101" width="180" height="16" rx="2"/><text class="lb" x="715" y="112" text-anchor="middle">webhook del pago coincide</text><rect class="mask" x="525" y="241" width="105" height="16" rx="2"/><text class="lb" x="578" y="252" text-anchor="middle">monto o cuenta</text><rect class="mask" x="817" y="241" width="146" height="16" rx="2"/><text class="lb" x="890" y="252" text-anchor="middle">otro evento coincide</text><text class="note" x="30" y="40">Mientras haya una operación creando o incierto no se abre otra (registro.py:82).</text><text class="note" x="30" y="60">Línea punteada: se deduce de _recibir, que no mira el estado anterior (registro.py:243-260).</text><line class="hair" x1="30" y1="571" x2="1150" y2="571"/><text class="eyebrow" x="30" y="589">Leyenda</text><rect class="nd-focal" x="110" y="577" width="22" height="14" rx="3"/><text class="lb" x="140" y="589">hay que revisarlo a mano</text><rect class="nd-ok" x="331.6" y="577" width="22" height="14" rx="3"/><text class="lb" x="361.6" y="589">estado final bueno</text><rect class="nd" x="511.8" y="577" width="22" height="14" rx="3"/><text class="lb" x="541.8" y="589">estado intermedio</text><line class="ar g" x1="685.0999999999999" y1="585" x2="715.0999999999999" y2="585"/><text class="lb" x="723.0999999999999" y="589">pago</text><line class="ar d" x1="776.6999999999999" y1="585" x2="806.6999999999999" y2="585"/><text class="lb" x="814.6999999999999" y="589">deducido del código</text></svg>